<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop-Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true"></div>

    <div class="lock-screen" id="lockScreen">
      <div class="lock-content">
        <div class="lock-time" id="lockTime">--:--</div>
        <div class="lock-date" id="lockDate">--</div>
        <p class="lock-hint">Klicken Sie auf den Bildschirm, um sich anzumelden</p>
      </div>
    </div>

    <div class="login-screen hidden" id="loginScreen">
      <div class="auth-panel">
        <div class="avatar-wrap">
          <img class="avatar" id="avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80" alt="Profilbild" />
        </div>

        <h1 id="userNameDisplay">Benutzer</h1>
        <p class="subtitle">Bitte melden Sie sich an</p>

        <p class="config-hint">Anmeldedaten werden aus der GitHub-Konfiguration geladen.</p>

        <form id="loginForm" class="login-form">
          <div class="input-group">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-3.3 0-6 1.8-6 4v1h12v-1c0-2.2-2.7-4-6-4Z" />
            </svg>
            <input id="username" name="username" type="text" placeholder="Benutzername" autocomplete="username" required />
          </div>

          <div class="password-field">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 9V7A5 5 0 0 0 7 7v2H5v12h14V9Zm-8-2a3 3 0 0 1 6 0v2H9Zm6 10h-8v-6h8Z" />
            </svg>
            <input id="password" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required />
            <button class="toggle-password" id="togglePassword" type="button" aria-label="Passwort ein-/ausblenden">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5c5 0 9 4 9 7s-4 7-9 7-9-4-9-7 4-7 9-7Zm0 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5Zm0 2a3 3 0 1 1-3 3 3 3 0 0 1 3-3Z" />
              </svg>
            </button>
          </div>

          <button class="submit-btn" type="submit" aria-label="Anmelden">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41L13.17 12Z" />
            </svg>
          </button>
        </form>

        <div class="welcome-stage" id="welcomeStage">
          <h2>Willkommen</h2>
          <div class="spinner" aria-hidden="true"></div>
        </div>

        <p class="error" id="errorMessage"></p>
      </div>
    </div>

    <div class="desktop hidden" id="desktop">
      <div class="desktop-icons">
        <div class="desktop-icon">
          <div class="icon">📁</div>
          <span>Dokumente</span>
        </div>
        <div class="desktop-icon">
          <div class="icon">🖼️</div>
          <span>Bilder</span>
        </div>
        <div class="desktop-icon">
          <div class="icon">🌐</div>
          <span>Browser</span>
        </div>
      </div>

      <div class="taskbar" id="taskbar">
        <button class="start-button" id="startButton">⊞ Start</button>
        <div class="taskbar-apps">
          <div class="taskbar-app active">Explorer</div>
          <div class="taskbar-app">Edge</div>
        </div>
        <div class="clock" id="clockTaskbar"></div>
      </div>

      <div class="start-menu hidden" id="startMenu">
        <div class="menu-item">📁 Dokumente</div>
        <div class="menu-item">🖼️ Bilder</div>
        <div class="menu-item">⚙️ Einstellungen</div>
        <div class="menu-item">⏻ Abmelden</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
